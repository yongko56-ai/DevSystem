/* ALGORITMO DE SIMILITUD PARA IA */
function getDistance(a, b) {
    if(a.length === 0) return b.length; 
    if(b.length === 0) return a.length;
    var m = a.length, n = b.length;
    var dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
    for(var i = 0; i <= m; i++) dp[i][0] = i;
    for(var j = 0; j <= n; j++) dp[0][j] = j;
    for(var i = 1; i <= m; i++) {
        for(var j = 1; j <= n; j++) {
            if(a[i-1] === b[j-1]) dp[i][j] = dp[i-1][j-1];
            else dp[i][j] = 1 + Math.min(dp[i-1][j-1], dp[i][j-1], dp[i-1][j]);
        }
    }
    return dp[m][n];
}

/* FUNCION PARA ROTAR IMAGEN (PARA LEER TEXTO VERTICAL) */
function getRotatedImage(src, degrees) {
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 1000; 
                let w = img.width;
                let h = img.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                    else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                }
            if (degrees === 90 || degrees === 270) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(degrees * Math.PI / 180);
            ctx.drawImage(img, -w / 2, -h / 2, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => resolve(src);
        img.src = src;
    });
}

/* FUNCIONALIDAD OCR PARA AUDITAR UNA SOLA IMAGEN EN ZOOM (CON ROTACIÓN) */
window.auditarZoomImg = async function(btn, imgEl, targetStr, resEl) {
    var src = imgEl.src;
    if(!src) return;
    var target = targetStr || '';
    if(!target) { toast('No hay serie asignada para auditar','error'); return; }
    
    var originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Inspeccionando...';
    btn.disabled = true;
    if(resEl) resEl.innerHTML = '<span class="text-[var(--muted)]"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Inspeccionando imagen...</span>';
    
    var found = false;
    var detectedSnippets = [];
    var rotations = [0, 90, 180, 270];

    try {
        for (var i = 0; i < rotations.length; i++) {
            if (found) break;
            var deg = rotations[i];
            var imgToProcess = src;
            if (deg !== 0) {
                if(resEl) resEl.innerHTML = '<span class="text-[var(--muted)]"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Probando orientación '+deg+'°...</span>';
                imgToProcess = await getRotatedImage(src, deg);
            }

            var result = await Tesseract.recognize(imgToProcess, 'eng', { logger: m => {} });
            var rawText = (result.data.text || '').toUpperCase();
            var cleanText = rawText.replace(/[^A-Z0-9]/g, '');

            if (cleanText.length > 0) {
                detectedSnippets.push(cleanText.substring(0, 40));
            }

            if (cleanText.length >= target.length) {
                for (var j = 0; j <= cleanText.length - target.length; j++) {
                    var sub = cleanText.substring(j, j + target.length);
                    var dist = getDistance(sub, target);
                    if (dist <= 2) {
                        found = true;
                        break;
                    }
                }
            }
        }

        btn.innerHTML = originalHtml;
        btn.disabled = false;
        
        if (found) {
            var msg = '¡Verificación exitosa! El serial ' + target + ' fue detectado en la foto.';
            toast(msg, 'success', 6000);
            if (resEl) resEl.innerHTML = '<span class="text-[var(--success)] font-bold"><i class="fa-solid fa-check-circle mr-2"></i>¡Serial detectado!</span>';
        } else {
            var snippet = detectedSnippets.length > 0 ? detectedSnippets[0] : 'Ninguno';
            var msg = 'No se detectó el serial. Texto: "' + snippet + '..."';
            toast(msg, 'error', 6000);
            if (resEl) resEl.innerHTML = '<span class="text-[var(--danger)] font-bold"><i class="fa-solid fa-times-circle mr-2"></i>No detectado en esta foto</span>';
        }
    } catch (e) {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        toast('Error al procesar la imagen', 'error');
        if (resEl) resEl.innerHTML = '<span class="text-[var(--danger)]">Error al procesar</span>';
    }
};

/* VISOR DE IMAGEN CON MARCO, FLECHAS Y BOTON IA */
window.abrirZoom = function(thumbEl, targetStr) {
    var parentGrid = thumbEl.parentElement;
    var imgs = Array.from(parentGrid.querySelectorAll('img')).map(i => i.src);
    if(imgs.length === 0) return;
    
    var currentSrc = thumbEl.querySelector('img').src;
    var currentIndex = imgs.indexOf(currentSrc);
    if(currentIndex === -1) currentIndex = 0;
    
    var target = decodeURIComponent(targetStr || '').trim().toUpperCase();

    var m = document.createElement('div');
    m.className = 'modal-backdrop';
    m.style.zIndex = '1500'; 
    
    m.addEventListener('click', function(e){
        if(e.target === m) m.remove();
    });
    
    var content = document.createElement('div');
    content.className = 'modal-content';
    content.style.maxWidth = '850px';
    content.style.padding = '0';
    content.style.overflow = 'hidden';
    
    // Header
    var header = document.createElement('div');
    header.className = 'p-4 border-b border-[var(--border)] flex items-center justify-between bg-[var(--surface-2)]';
    var title = document.createElement('div');
    title.className = 'font-mono text-xs tracking-[0.1em] text-[var(--muted)]';
    title.id = 'zoom-title';
    title.textContent = 'EVIDENCIA ' + (currentIndex + 1) + ' / ' + imgs.length;
    
    var closeBtn = document.createElement('button');
    closeBtn.className = 'btn btn-ghost btn-xs';
    closeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> CERRAR';
    closeBtn.onclick = function(){ m.remove(); };
    
    header.appendChild(title);
    header.appendChild(closeBtn);
    
    // Body (Imagen)
    var body = document.createElement('div');
    body.className = 'p-6 flex items-center justify-center bg-[var(--bg)]';
    body.style.minHeight = '300px';
    body.style.maxHeight = '65vh';
    
    var imgEl = document.createElement('img');
    imgEl.id = 'zoom-img';
    imgEl.src = imgs[currentIndex];
    imgEl.style.maxWidth = '100%';
    imgEl.style.maxHeight = '65vh';
    imgEl.style.objectFit = 'contain';
    imgEl.style.borderRadius = '4px';
    imgEl.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
    body.appendChild(imgEl);
    
    // Resultado IA
    var resEl = document.createElement('div');
    resEl.className = 'py-3 text-center font-mono text-sm border-t border-[var(--border)]';
    resEl.id = 'zoom-result';
    resEl.innerHTML = '<span class="text-[var(--muted)]">Presiona ✨IA para inspeccionar foto</span>';
    
    // Footer (Botones)
    var footer = document.createElement('div');
    footer.className = 'p-4 border-t border-[var(--border)] flex items-center justify-between gap-4 bg-[var(--surface-2)]';
    
    var prevBtn = document.createElement('button');
    prevBtn.className = 'btn btn-ghost btn-sm';
    prevBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> ANTERIOR';
    prevBtn.onclick = function(){
        currentIndex = (currentIndex - 1 + imgs.length) % imgs.length;
        imgEl.src = imgs[currentIndex];
        title.textContent = 'EVIDENCIA ' + (currentIndex + 1) + ' / ' + imgs.length;
        resEl.innerHTML = '<span class="text-[var(--muted)]">Presiona ✨IA para inspeccionar foto</span>';
    };
    
    var aiBtn = document.createElement('button');
    aiBtn.className = 'btn btn-primary btn-sm';
    aiBtn.innerHTML = '✨ IA';
    aiBtn.onclick = function(){
        auditarZoomImg(this, imgEl, target, resEl);
    };
    
    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-ghost btn-sm';
    nextBtn.innerHTML = 'SIGUIENTE <i class="fa-solid fa-arrow-right"></i>';
    nextBtn.onclick = function(){
        currentIndex = (currentIndex + 1) % imgs.length;
        imgEl.src = imgs[currentIndex];
        title.textContent = 'EVIDENCIA ' + (currentIndex + 1) + ' / ' + imgs.length;
        resEl.innerHTML = '<span class="text-[var(--muted)]">Presiona ✨IA para inspeccionar foto</span>';
    };
    
    footer.appendChild(prevBtn);
    footer.appendChild(aiBtn);
    footer.appendChild(nextBtn);
    
    content.appendChild(header);
    content.appendChild(body);
    content.appendChild(resEl);
    content.appendChild(footer);
    m.appendChild(content);
    document.body.appendChild(m);
};

function rTR(){var r=S.reasignacion;var to=r.tecnicoOrigenId?gTB(r.tecnicoOrigenId):null;var eo=to?to.epis:[];var as=eo.length>0&&r.selectedEppIds.length===eo.length;var td=r.tecnicoDestinoId?gTB(r.tecnicoDestinoId):null;return'<div class="grid lg:grid-cols-2 gap-8"><div><div class="section-header"><span class="section-number">01</span><h3 class="section-title" style="font-size:22px">Origen</h3><div class="section-line"></div></div><select class="field-input" onchange="sTO(this.value)"><option value="">-- Seleccione --</option>'+S.tecnicos.map(function(t){return'<option value="'+t.id+'" '+(r.tecnicoOrigenId===t.id?'selected':'')+'>'+esc(t.nombreCompleto)+'</option>'}).join('')+'</select>'+(eo.length>0?'<div class="mt-5 bg-[var(--surface)] border border-[var(--border)] rounded overflow-hidden"><label class="flex items-center gap-3 cursor-pointer p-4 border-b border-[var(--border)] bg-[var(--surface-2)]"><input type="checkbox" id="cb-sa" class="epp-checkbox" '+(as?'checked':'')+' onchange="tAE(this.checked)"><span class="font-mono text-xs font-bold text-[var(--accent)]">SELECCIONAR TODOS ('+eo.length+')</span></label><div class="divide-y divide-[var(--border)]">'+eo.map(function(e){var is=r.selectedEppIds.includes(e.id);return'<label class="reassign-epp-item '+(is?'selected':'')+'" onclick="tEL(event,\''+e.id+'\')"><input type="checkbox" class="epp-checkbox" '+(is?'checked':'')+' onchange="tE(\''+e.id+'\',this.checked)" onclick="event.stopPropagation()"><i class="fa-solid '+gPI(e.producto)+' text-[var(--accent)] text-sm w-5 text-center"></i><div class="flex-1 min-w-0"><div class="text-sm font-medium truncate">'+esc(e.producto)+'</div><div class="font-mono text-[10px] text-[var(--muted)] truncate">'+esc(e.numeroSerie)+'</div></div>'+(is?'<i class="fa-solid fa-circle-check text-[var(--accent)] text-sm"></i>':'')+'</label>'}).join('')+'</div></div><div class="mt-3 flex items-center gap-3"><div class="comparison-bar flex-1" style="height:4px"><div class="seg-devuelto" style="width:'+(eo.length>0?(r.selectedEppIds.length/eo.length*100):0)+'%"></div></div><span class="font-mono text-[10px] text-[var(--muted)]">'+r.selectedEppIds.length+'/'+eo.length+'</span></div>':r.tecnicoOrigenId?'<div class="mt-5 text-center py-10 border border-dashed border-[var(--border)] rounded"><i class="fa-solid fa-box-open text-3xl text-[var(--muted)] mb-3"></i><div class="text-sm text-[var(--muted)]">Sin EPPs</div></div>':'<div class="mt-5 text-center py-10 border border-dashed border-[var(--border)] rounded"><i class="fa-solid fa-arrow-up-from-bracket text-3xl text-[var(--muted)] mb-3"></i><div class="text-sm text-[var(--muted)]">Seleccione t\u00e9cnico</div></div>')+'</div><div><div class="section-header"><span class="section-number">02</span><h3 class="section-title" style="font-size:22px">Destino</h3><div class="section-line"></div></div><select class="field-input" onchange="sTD(this.value)" '+(r.tecnicoOrigenId?'':'disabled')+'><option value="">-- Seleccione destino --</option>'+S.tecnicos.filter(function(t){return t.id!==r.tecnicoOrigenId}).map(function(t){return'<option value="'+t.id+'" '+(r.tecnicoDestinoId===t.id?'selected':'')+'>'+esc(t.nombreCompleto)+'</option>'}).join('')+'</select>'+(td?'<div class="mt-5 bg-[var(--surface)] border border-[var(--border)] rounded p-4"><div class="font-mono text-[10px] text-[var(--muted)] mb-3">EPPS ACTUALES</div>'+(td.epis.length>0?'<div class="space-y-2">'+td.epis.map(function(e){return'<div class="flex items-center gap-2 py-1"><i class="fa-solid '+gPI(e.producto)+' text-[var(--muted)] text-xs w-4 text-center"></i><span class="text-xs">'+esc(e.producto)+'</span><span class="font-mono text-[10px] text-[var(--muted)]">\u2014 '+esc(e.numeroSerie)+'</span></div>'}).join('')+'</div>':'<div class="text-xs text-[var(--muted)]">Sin EPPs</div>')+'</div>':'')+'<button class="btn btn-primary w-full justify-center mt-6 '+(r.selectedEppIds.length===0||!r.tecnicoDestinoId?'opacity-40 cursor-not-allowed':'')+'" onclick="cR()"><i class="fa-solid fa-arrows-rotate"></i> REASIGNAR '+(r.selectedEppIds.length>0?r.selectedEppIds.length:'')+' EPP'+(r.selectedEppIds.length!==1?'S':'')+'</button></div></div>'}
window.sTO=function(id){S.reasignacion.tecnicoOrigenId=id;S.reasignacion.selectedEppIds=[];if(id===S.reasignacion.tecnicoDestinoId)S.reasignacion.tecnicoDestinoId='';ren()};
window.sTD=function(id){S.reasignacion.tecnicoDestinoId=id;ren()};
window.tAE=function(c){var t=gTB(S.reasignacion.tecnicoOrigenId);if(t)S.reasignacion.selectedEppIds=c?t.epis.map(function(e){return e.id}):[];ren()};
window.tE=function(eid,c){var ids=S.reasignacion.selectedEppIds;if(c&&ids.indexOf(eid)===-1)ids.push(eid);if(!c)S.reasignacion.selectedEppIds=ids.filter(function(id){return id!==eid});ren()};
window.tEL=function(ev,eid){if(ev.target.type==='checkbox')return;var cb=ev.currentTarget.querySelector('input[type="checkbox"]');if(cb){cb.checked=!cb.checked;tE(eid,cb.checked)}};
window.cR=function(){var r=S.reasignacion;if(!r.tecnicoOrigenId){toast('Seleccione origen','error');return}if(!r.tecnicoDestinoId){toast('Seleccione destino','error');return}if(!r.selectedEppIds.length){toast('Seleccione al menos un EPP','error');return}var og=gTB(r.tecnicoOrigenId);var ds=gTB(r.tecnicoDestinoId);var mv=og.epis.filter(function(e){return r.selectedEppIds.indexOf(e.id)!==-1});clM();document.getElementById('modal-root').innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)clM()"><div class="modal-content" style="max-width:560px"><div class="p-6 border-b border-[var(--border)] flex items-center justify-between"><div class="flex items-center gap-3"><i class="fa-solid fa-arrows-rotate text-[var(--accent-2)] text-xl"></i><div><div class="font-mono text-[10px] text-[var(--accent-2)]">CONFIRMAR</div><div class="font-display font-bold text-lg">'+mv.length+' EPP'+(mv.length!==1?'S':'')+'</div></div></div><button onclick="clM()" class="text-[var(--muted)] text-xl"><i class="fa-solid fa-xmark"></i></button></div><div class="p-6"><div class="flex items-center gap-4 mb-6"><div class="flex-1 p-4 bg-[var(--surface-2)] border border-[var(--border)] rounded text-center"><div class="font-mono text-[9px] text-[var(--muted)] mb-1">ORIGEN</div><div class="font-bold text-sm">'+esc(og.nombreCompleto)+'</div></div><i class="fa-solid fa-arrow-right text-[var(--accent)] text-xl"></i><div class="flex-1 p-4 bg-[var(--surface-2)] border border-[var(--border)] rounded text-center"><div class="font-mono text-[9px] text-[var(--muted)] mb-1">DESTINO</div><div class="font-bold text-sm">'+esc(ds.nombreCompleto)+'</div></div></div><div class="bg-[var(--surface-2)] border border-[var(--border)] rounded p-4 mb-6">'+mv.map(function(e){return'<div class="confirm-list-item"><i class="fa-solid '+gPI(e.producto)+' text-[var(--accent)] text-sm w-5 text-center"></i><span class="text-sm flex-1">'+esc(e.producto)+'</span><span class="font-mono text-[10px] text-[var(--muted)]">'+esc(e.numeroSerie)+'</span></div>'}).join('')+'</div><div class="flex gap-3"><button class="btn btn-ghost flex-1 justify-center" onclick="clM()"><i class="fa-solid fa-xmark"></i> CANCELAR</button><button class="btn btn-primary flex-1 justify-center" onclick="eR()"><i class="fa-solid fa-check"></i> CONFIRMAR</button></div></div></div></div>'};
window.eR=function(){var r=S.reasignacion;var og=gTB(r.tecnicoOrigenId);var ds=gTB(r.tecnicoDestinoId);if(!og||!ds)return;var mv=og.epis.filter(function(e){return r.selectedEppIds.indexOf(e.id)!==-1});ds.epis.push.apply(ds.epis,mv);og.epis=og.epis.filter(function(e){return r.selectedEppIds.indexOf(e.id)===-1});save();clM();toast(mv.length+' EPP reasignado(s)','success');S.reasignacion={tecnicoOrigenId:'',tecnicoDestinoId:'',selectedEppIds:[]};ren()};

load();ren();setInterval(uClk,1000);uClk();
</script>
